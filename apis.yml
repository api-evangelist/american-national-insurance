  reason: no-developer-program
  detail: >-
    American National ships customer-facing web and mobile apps but no developer program at all —
    /developers, /developer, /api-docs, /openapi.json, /swagger.json and /llms.txt are all hard 404s
    on www.americannational.com, its 280-URL sitemap contains no API or integration page, and the two
    IBM API Connect gateways found in the client-portal JavaScript bundle
    (api.americannational.com and apigw.americannational.com/american-national/prod) are private
    back ends that answer every path with an HTTP 500 SOAP fault rather than a published contract.
